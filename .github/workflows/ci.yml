name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install backend deps
        run: |
          cd server
          npm ci
      - name: Install frontend deps
        run: |
          cd client
          npm ci
      - name: Validate backend syntax
        run: |
          cd server
          npm run lint
          npm run test:realtime-scope
      - name: Build frontend
        env:
          VITE_API_URL: https://api.validation.invalid
          VITE_SOCKET_URL: https://socket.validation.invalid
        run: |
          cd client
          npm run build
