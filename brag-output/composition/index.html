    *{box-sizing:border-box} body{margin:0;background:#071d1a;color:var(--ink);font-family:Sora,Arial,sans-serif;overflow:hidden}.stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--bg);transform-origin:top left}.scene{position:absolute;inset:0;opacity:0;transform:translateX(32px) scale(.985);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}.scene.active{opacity:1;transform:translateX(0) scale(1)}.scene.exit{opacity:0;transform:translateX(-24px) scale(.99)}
    .intro,.closing{background:radial-gradient(circle at 76% 22%,#10b98155,transparent 33%),linear-gradient(135deg,#062f27,#0b1716 62%,#0b2d23);color:#fff;padding:116px 142px;display:flex;flex-direction:column;justify-content:center}.orb{position:absolute;border:1px solid #86efac33;border-radius:50%;width:680px;height:680px;right:-110px;top:-200px;box-shadow:0 0 100px #10b98130 inset}.eyebrow{font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6ee7b7}.intro h1,.closing h1{font-size:94px;line-height:1.04;letter-spacing:-.065em;margin:24px 0}.intro h1 b,.closing h1 b{color:#6ee7b7}.intro p,.closing p{font-size:31px;max-width:880px;line-height:1.55;color:#d1fae5}.brand-pill{display:inline-flex;width:max-content;gap:14px;align-items:center;padding:14px 20px;border:1px solid #ffffff2b;border-radius:99px;background:#ffffff12;font-weight:600;font-size:20px}.dot{width:13px;height:13px;background:#6ee7b7;border-radius:50%;box-shadow:0 0 0 8px #6ee7b722}.fineprint{position:absolute;left:142px;bottom:78px;color:#a7f3d0;font-size:17px}.title-card{position:absolute;right:130px;bottom:130px;background:#ffffff0f;border:1px solid #ffffff2d;border-radius:28px;padding:34px;width:520px;backdrop-filter:blur(12px)}.title-card .mini{font-size:18px;color:#bbf7d0}.title-card strong{display:block;font-size:34px;margin-top:13px}
    .app{height:100%;background:var(--bg);display:grid;grid-template-columns:280px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:34px 22px}.logo{font-size:28px;font-weight:800;letter-spacing:-.06em;margin:0 0 8px}.logo span{color:var(--brand)}.tagline{font-size:12px;color:var(--muted);margin-bottom:42px}.nav-group{font-size:12px;font-weight:700;color:#94a3b8;letter-spacing:.12em;text-transform:uppercase;margin:26px 12px 10px}.nav{padding:12px 13px;border-radius:12px;color:#475569;font-size:15px;margin:3px 0}.nav.active{background:#ecfdf5;color:#047857;font-weight:700}.nav i{font-style:normal;display:inline-flex;width:26px;color:inherit}.main{padding:0 44px 36px;overflow:hidden}.top{height:98px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e9eef4}.crumb h2{margin:0;font-size:29px;letter-spacing:-.045em}.crumb p{margin:7px 0 0;font-size:14px;color:var(--muted)}.right-top{display:flex;gap:15px;align-items:center}.outlet{border:1px solid #a7f3d0;background:#ecfdf5;border-radius:12px;padding:11px 15px;color:#047857;font-size:14px;font-weight:700}.avatar{width:42px;height:42px;border-radius:50%;background:#d1fae5;color:#047857;display:grid;place-items:center;font-weight:800}.content{padding-top:30px}.caption{position:absolute;z-index:10;right:44px;bottom:36px;max-width:545px;background:#0f172aee;color:#fff;border-radius:15px;padding:16px 20px;font-size:17px;line-height:1.45;box-shadow:0 14px 34px #0f172a33}.caption b{color:#6ee7b7}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 2px 5px #0f172a08}.metric{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.value{font-size:34px;font-weight:800;letter-spacing:-.05em;margin:10px 0 8px}.trend{font-size:13px;color:#047857;font-weight:700}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-t :#6d28d9}.slate{background:#f1f5f9;color:#475569}.tables{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.table-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;min-height:170px}.table-card .tn{font-size:25px;font-weight:800}.table-card p{font-size:13px;color:var(--muted)}.selected{outline:3px solid #6ee7b7;background:#f0fdf4}.order-layout{display:grid;grid-template-columns:1fr .72fr;gap:19px}.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.menu-item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.menu-item .food{font-weight:700}.price{color:#047857;font-size:14px;font-weight:700;margin-top:8px}.cart-line{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f1f5f9;font-size:14px}.total{display:flex;justify-content:space-between;margin-top:18px;font-size:22px;font-weight:800}.kds{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.kds-col{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;min-height:490px}.kds-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:15px}.ticket{border:1px solid #e2e8f0;border-left:5px solid #f59e0b;border-radius:12px;padding:15px;margin-bottom:12px;background:#fff}.ticket.ready{border-left-color:#10b981}.ticket h4{margin:0;font-size:16px}.ticket p{font-size:13px;margin:8px 0;color:#475569}.ticket-foot{font-size:11px;color:#64748b}.bill-layout{display:grid;grid-template-columns:.85fr 1.2fr .8fr;gap:18px}.stack{display:grid;gap:10px}.list-row{padding:13px;border:1px solid #e2e8f0;background:#fff;border-radius:12px;font-size:14px}.active-row{background:#ecfdf5;border-color:#6ee7b7}.pay-methods{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.pay{padding:13px 16px;border:1px solid #cbd5e1;border-radius:10px;font-weight:700;font-size:13px;background:#fff}.pay.active{background:#047857;color:#fff;border-color:#047857}.receipt{max-width:530px;margin:15px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 16px 35px #0f172a10}.receipt h3{text-align:center;font-size:24px;margin:0}.receipt hr{border:0;border-top:1px dashed #cbd5e1;margin:18px 0}.receipt-line{display:flex;justify-content:space-between;font-size:14px;margin:10px 0}.success{background:#ecfdf5;border:1px solid #86efac;color:#047857;border-radius:12px;padding:14px;text-align:center;font-weight:800;margin-top:18px}.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat-mini{padding:15px;background:#fff;border:1px solid var(--line);border-radius:14px}.stat-mini strong{display:block;font-size:25px;margin-top:8px}.form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.input{border:1px solid #cbd5e1;border-radius:10px;padding:13px;color:#94a3b8;font-size:13px}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.kanban .col{background:#f8fafc;border:1px solid var(--line);border-radius:15px;padding:14px}.kanban .item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px;font-size:13px}.owner-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.profile{display:grid;grid-template-columns:72px 1fr;gap:16px}.round{width:60px;height:60px;border-radius:50%;background:#d1fae5;color:#047857;display:grid;place-items:center;font-size:22px;font-weight:800}.big-number{font-size:44px;font-weight:800;letter-spacing:-.06em}.flow{display:flex;align-items:center;gap:0;margin:45px 0}.flow .node{flex:1;min-height:128px;border:1px solid #a7f3d0;background:#ecfdf5;border-radius:18px;padding:20px}.flow .node strong{display:block;font-size:17px}.flow .node p{font-size:13px;color:#475569}.arrow{width:48px;color:#059669;text-align:center;font-size:30px}.ending-modules{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:42px}.ending-modules .card{background:#ffffff12;border-color:#ffffff2b;color:#fff}.ending-modules .metric{color:#a7f3d0}.closing{align-items:center;text-align:center;padding:80px}.closing h1{font-size:82px}.closing .fineprint{left:0;width:100%;text-align:center}.demo-badge{position:absolute;right:42px;top:30px;background:#fff;border:1px solid #cbd5e1;color:#475569;border-radius:99px;padding:10px 16px;font-size:12px;font-weight:700;z-index:30}.scene-number{position:absolute;left:304px;bottom:38px;color:#94a3b8;font-size:12px;font-weight:700;letter-spacing:.1em}.qr{width:124px;height:124px;background:repeating-linear-gradient(45deg,#0f172a 0 9px,#fff 9px 18px);opacity:.24;border-radius:8px}.notice{padding:14px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:13px;line-height:1.45}.hide{display:none}
    .intro,.closing{height:100%}

<body>
  <div id="stage" class="stage"></div>
  <audio id="music" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3" loop></audio>
  <script>
  const cap=(title,text)=>`<div class="caption"><b>${title}</b><br>${text}</div>`;
  const shell=(title,subtitle,active,body,caption,n=1)=>`<div class="app"><aside class="sidebar"><div class="logo">Resto<span>Sphere</span></div><div class="tagline">Restaurant Management Simplified</div><div class="nav-group">Operations</div>${['Dashboard','Tables','Service Cockpit','Orders','Kitchen Display','Billing'].map(x=>`<div class="nav ${x===active?'active':''}"><i>◌</i>${x}</div>`).join('')}<div class="nav-group">Management</div>${['Inventory & Recipes','Procurement','Customers','Loyalty & Rewards','Online Orders','Reports','Business Intelligence'].map(x=>`<div class="nav ${x===active?'active':''}"><i>◌</i>${x}</div>`).join('')}</aside><main class="main"><header class="top"><div class="crumb"><h2>${title}</h2><p>${subtitle}</p></div><div class="right-top"><div class="outlet">⌖ The Juniper Table · Main Dining ▾</div><div class="avatar">JT</div></div></header><section class="content">${body}</section></main>${cap(caption[0],caption[1])}<div class="scene-number">RESTOSPHERE CLIENT DEMO · ${String(n).padStart(2,'0')} / 24</div></div>`;
  const kpis=(items)=>`<div class="kpis">${items.map(([a,b,c])=>`<div class="card"><div class="metric">${a}</div><div class="value">${b}</div><div class="trend">${c||'● Live operational view'}</div></div>`).join('')}</div>`;
  const row=(cells,head=false)=>`<div class="tr ${head?'head':''}">${cells.map(x=>`<div>${x}</div>`).join('')}</div>`;
  const screens=[
    {d:9,html:`<div class="intro"><div class="orb"></div><div class="brand-pill"><span class="dot"></span>ANOVA Technologies</div><div class="eyebrow" style="margin-top:42px">Restaurant & hotel operations</div><h1>Meet Resto<b>Sphere</b>.</h1><p>Every table. Every order. One operating view.</p><div class="title-card"><div class="mini">Client demonstration</div><strong>Restaurant Management Simplified</strong></div><div class="fineprint">Safe demonstration using fictional restaurant data · No live payments</div></div>`},
    {d:8,html:`<div class="intro" style="background:linear-gradient(135deg,#ecfdf5,#f8fafc 60%,#d1fae5);color:#0f172a"><div style="margin:auto;width:530px;background:#fff;border:1px solid #e2e8f0;border-radius:28px;padding:45px;box-shadow:0 24px 50px #0f172a18"><div class="logo">Resto<span>Sphere</span></div><p style="font-size:17px;color:#64748b">Restaurant Management Simplified</p><h2 style="font-size:31px;margin:35px 0 10px">Welcome back</h2><p style="font-size:15px;color:#64748b">Login to your account to continue</p><div class="input" style="margin-top:24px">demo.owner@junipertable.example</div><div class="input" style="margin-top:12px">••••••••••••</div><div class="btn" style="display:flex;justify-content:center;margin-top:18px">Sign in securely</div><p style="font-size:12px;color:#64748b;text-align:center;margin-top:18px">Demo account shown — credentials are never displayed</p></div>${cap('Secure access','Role-aware login leads each team member to the workspace they need.')}</div>`},
    {d:10,html:shell('Dashboard','Today’s performance, changes, and operational follow-up.','Dashboard',`${kpis([['Today’s revenue','₹86,420','↑ 12.4% vs yesterday'],['Paid orders','148','↑ 9.1% vs yesterday'],['Available tables','12','● Service ready'],['Low stock items','3','Review stock']])}<div class="grid2"><div class="card"><h3 class="section-title">Sales overview</h3><p class="sub">Daily sales · current outlet</p><div class="chart">${[48,70,55,81,68,92,76].map((h,i)=>`<div class="bar" style="height:${h}%" data-day="${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}"></div>`).join('')}</div></div><div class="card"><h3 class="section-title">What changed today</h3><p class="sub">Compared with yesterday</p><div class="signal">3 ingredient items are at or below reorder level</div><div class="signal" style="background:#ecfdf5;border-color:#a7f3d0;color:#047857">12 tables are ready for the next seating</div><div class="signal">2 online orders need kitchen confirmation</div></div></div>`,['Dashboard','See today’s performance alongside live operational follow-up.'],3)},
    {d:8,html:shell('Dashboard','Outlet-aware data and actions for the current workspace.','Dashboard',`<div class="owner-grid"><div class="card"><h3 class="section-title">Current outlet</h3><p class="sub">Change outlet without leaving the operating workspace.</p><div class="outlet" style="font-size:17px;padding:18px">⌖ The Juniper Table · Main Dining ▾</div><div class="table" style="margin-top:18px">${row(['Outlet','Address','Status','Service mode',''],true)}${row(['Main Dining','Market Road','<span class="badge green">Active</span>','Dine-in · Takeaway','<span class="btn">Selected</span>'])}${row(['Rooftop Terrace','Market Road','<span class="badge green">Active</span>','Dine-in','<span class="btn alt">Switch</span>'])}${row(['Banquet Hall','Market Road','<span class="badge slate">Inactive</span>','Events','<span class="btn alt">View</span>'])}</div></div><div class="card"><h3 class="section-title">Scoped operations</h3><p class="sub">Orders, tables, stock, and reports reflect the outlet currently selected.</p><div class="mini-grid" style="grid-template-columns:1fr 1fr"><div class="stat-mini"><div class="metric">Open tables</div><strong>12</strong></div><div class="stat-mini"><div class="metric">Active KOTs</div><strong>7</strong></div><div class="stat-mini"><div class="metric">Today’s sales</div><strong>₹86k</strong></div><div class="stat-mini"><div class="metric">Team on duty</div><strong>18</strong></div></div></div></div>`,['Outlet management','Switching outlets keeps daily operations clearly scoped.'],4)},
    {d:10,html:shell('Table Management','Manage table availability and open the right service flow.','Tables',`<div class="toolbar"><div class="filters"><span class="filter active">All tables</span><span class="filter">Available</span><span class="filter">Occupied</span><span class="filter">Reserved</span></div><span class="btn">+ Add table</span></div><div class="tables">${[['Table 04','Available','4 covers','green'],['Table 08','Occupied','Order #1048 · Preparing','rose'],['Table 12','Available','6 covers','green'],['Table 16','Reserved','7:30 PM · 4 covers','violet'],['Table 20','Maintenance','Temporarily unavailable','amber'],['Table 24','Occupied','Order #1046 · Ready','rose'],['Patio 02','Available','2 covers','green'],['Private 01','Reserved','8:15 PM · 10 covers','violet']].map(([a,b,c,t])=>`<div class="table-card ${a==='Table 12'?'selected':''}"><div class="tn">${a}</div><span class="badge ${t}">${b}</span><p>${c}</p>${a==='Table 12'?'<div class="btn" style="margin-top:13px">Create order</div>':''}</div>`).join('')}</div>`,['Table management','See table state at a glance, then start service directly from the selected table.'],5)},
    {d:14,html:shell('Create order','Table 12 · Dine-in service','Orders',`<div class="order-layout"><div><div class="toolbar"><div class="filters"><span class="filter active">Starters</span><span class="filter">Mains</span><span class="filter">Beverages</span><span class="filter">Desserts</span></div><span class="search">⌕ Search menu items</span></div><div class="menu-grid">${[['Smoked tomato soup','₹245'],['Crispy corn','₹295'],['Herb paneer tikka','₹365'],['Garden risotto','₹425'],['Saffron biryani','₹445'],['Juniper grilled fish','₹595'],['Cold brew','₹175'],['Citrus tart','₹220'],['Chef’s special thali','₹575']].map(([a,b])=>`<div class="menu-item"><div class="food">${a}</div><div class="small">Available · Kitchen station assigned</div><div class="price">${b} <span style="float:right;color:#059669;font-size:20px">＋</span></div></div>`).join('')}</div></div><div class="card"><div class="metric">New dine-in order</div><h3 class="section-title" style="margin-top:8px">Table 12 · 4 guests</h3><p class="sub">Customer: Walk-in guest</p><div class="cart-line"><span>1 × Smoked tomato soup</span><b>₹245</b></div><div class="cart-line"><span>2 × Herb paneer tikka</span><b>₹730</b></div><div class="cart-line"><span>1 × Garden risotto</span><b>₹425</b></div><div class="cart-line"><span>1 × Cold brew</span><b>₹175</b></div><div class="total"><span>Total</span><span>₹1,575</span></div><div class="btn" style="display:flex;justify-content:center;margin-top:20px">Create order & send to kitchen</div><p class="small" style="margin-top:15px">Order type, table, customer, special instructions, and payment preference are captured before submission.</p></div></div>`,['Create a new order','Choose the table, select available menu items, then send the order into the service and kitchen workflow.'],6)},
    {d:10,html:shell('Order Management','Search, filter, and follow each order from service to settlement.','Orders',`<div class="toolbar"><div class="filters"><span class="filter active">All orders</span><span class="filter">Open</span><span class="filter">Kitchen</span><span class="filter">Paid</span></div><span class="btn">+ Create order</span></div><div class="table">${row(['Order','Customer / table','Source','Amount','Kitchen','Payment'],true)}${row(['<b>#1049</b><div class="small">Just created</div>','Walk-in guest<br><small>Table 12</small>','Dine-in','₹1,575','<span class="badge amber">New KOT</span>','<span class="badge slate">Unpaid</span>'])}${row(['<b>#1048</b><div class="small">12 min ago</div>','A. Sharma<br><small>Table 08</small>','Dine-in','₹840','<span class="badge amber">Preparing</span>','<span class="badge green">Paid · Card</span>'])}${row(['<b>#1047</b><div class="small">18 min ago</div>','Delivery guest<br><small>Online</small>','Online order','₹1,220','<span class="badge green">Ready</span>','<span class="badge green">Paid · UPI</span>'])}${row(['<b>#1046</b><div class="small">24 min ago</div>','Walk-in guest<br><small>Table 24</small>','Dine-in','₹1,060','<span class="badge green">Served</span>','<span class="badge amber">Awaiting payment</span>'])}</div>`,['Order management','An operational order list brings table, kitchen, payment, and source status together.'],7)},

    {d:10,html:shell('Business Intelligence','Understand performance with clear operational metrics.','Business Intelligence',`<div class="toolbar"><div class="filters"><span class="filter active">Last 7 days</span><span class="filter">Last 30 days</span><span class="filter">This quarter</span></div><span class="btn alt">Refresh insights</span></div><div class="owner-grid"><div>${kpis([['Revenue change','+11.2%','vs previous period'],['Order volume','+8.4%','vs previous period']])}<div class="card" style="margin-top:18px"><h3 class="section-title">Performance movement</h3><p class="sub">Compare revenue, order volume, average order value, and key operational measures by period.</p><div class="chart">${[52,46,66,81,74,93,87].map((h,i)=>`<div class="bar" style="height:${h}%" data-day="Day ${i+1}"></div>`).join('')}</div></div></div><div class="card"><div class="metric">Operational signals</div><h3 class="section-title" style="margin-top:9px">Focus the next service window</h3><div class="signal">Low-stock risk: Cold brew beans are below reorder level.</div><div class="signal" style="background:#ecfdf5;border-color:#a7f3d0;color:#047857">Lunch revenue increased compared with the previous period.</div><div class="signal">Peak kitchen load appears between 1:00 and 2:00 PM.</div></div></div>`,['Business Intelligence','Turn connected operational data into comparable performance metrics and practical next actions.'],19)},
    {d:9,html:shell('RestoSphere Intelligence','Review restaurant insights and actionable alerts.','Business Intelligence',`<div class="card" style="background:#ecfdf5;border-color:#bbf7d0;padding:28px"><div class="metric" style="color:#047857">Management summary</div><p style="font-size:25px;line-height:1.48;font-weight:600;max-width:1100px">Lunch sales are growing while beverage stock needs attention. Main Dining has strong table utilisation, and the kitchen queue is currently within the selected service threshold.</p><p class="sub">Generated from Business Intelligence for the selected range. Deterministic operational evidence remains visible.</p></div><div class="mini-grid" style="margin-top:18px"><div class="stat-mini"><div class="metric">Revenue signal</div><strong style="color:#047857">Positive</strong><p class="small">Compared period</p></div><div class="stat-mini"><div class="metric">Stock signal</div><strong style="color:#b45309">Attention</strong><p class="small">3 items low</p></div><div class="stat-mini"><div class="metric">Kitchen signal</div><strong style="color:#047857">On track</strong><p class="small">Queue monitored</p></div><div class="stat-mini"><div class="metric">Table signal</div><strong style="color:#047857">12 ready</strong><p class="small">Main Dining</p></div></div>`,['RestoSphere Intelligence','An evidence-led management summary turns reports and live operational signals into a concise review.'],20)},
    {d:9,html:shell('Central Kitchen','Coordinate requisitions, production, and transfers.','Procurement',`<div class="kanban"><div class="col"><b>Outlet requisitions</b><div class="item"><b>REQ-087 · Main Dining</b><br><small>Fresh herbs · 3 kg</small><br><span class="badge amber" style="margin-top:8px">Pending review</span></div><div class="item"><b>REQ-088 · Rooftop Terrace</b><br><small>Prepared base · 12 portions</small></div></div><div class="col"><b>Production batches</b><div class="item"><b>PB-041 · Tomato base</b><br><small>Yield 40 portions</small><br><span class="badge amber" style="margin-top:8px">In production</span></div></div><div class="col"><b>Transfers</b><div class="item"><b>TR-066 · Main Dining</b><br><small>Ready for dispatch</small><br><span class="badge green" style="margin-top:8px">Approved</span></div></div></div><div class="card" style="margin-top:18px"><h3 class="section-title">One production flow for multiple outlets</h3><p class="sub">Coordinate requisitions, production batches, and stock transfers from a central kitchen workspace.</p></div>`,['Central kitchen','Coordinate requisitions, production, and transfers when your operation serves more than one outlet.'],21)},
    {d:10,html:shell('Service Cockpit','Front-of-house flow, service modes, and table readiness.','Service Cockpit',`<div class="owner-grid"><div class="card"><h3 class="section-title">Service mode</h3><p class="sub">A focused operational view for front-of-house teams.</p><div class="pay-methods"><span class="pay active">Dine-in</span><span class="pay">Takeaway</span><span class="pay">Delivery</span></div><div class="tables" style="grid-template-columns:repeat(3,1fr)">${[['12','Available','green'],['08','Preparing','amber'],['16','Reserved','violet'],['24','Ready','green'],['03','Occupied','rose'],['P02','Available','green']].map(([a,b,c])=>`<div class="table-card" style="min-height:116px;padding:16px"><div class="tn">${a}</div><span class="badge ${c}">${b}</span></div>`).join('')}</div></div><div class="card"><h3 class="section-title">Reservations</h3><p class="sub">Upcoming service context</p><div class="list-row"><b>7:30 PM · 4 guests</b><br><small>Table 16 · Confirmed</small></div><div class="list-row"><b>8:15 PM · 10 guests</b><br><small>Private 01 · Confirmed</small></div><div class="list-row"><b>8:30 PM · 2 guests</b><br><small>Patio 02 · Pending</small></div><div class="btn" style="margin-top:15px">Manage reservations</div></div></div>`,['Service cockpit & reservations','Keep service modes, table readiness, and upcoming reservations in the front-of-house flow.'],22)},
    {d:12,html:`<div class="intro"><div class="orb"></div><div class="eyebrow">One operating view</div><h1>From the first order<br>to the <b>full picture.</b></h1><p>RestoSphere connects daily service with the teams, stock, customers, payments, and insights that keep a restaurant or hotel moving.</p><div class="ending-modules">${[['Service','Tables · Orders · Kitchen'],['Settlement','Billing · Payments · Receipts'],['Operations','Inventory · Procurement · Staff'],['Growth','CRM · Loyalty · Intelligence']].map(([a,b])=>`<div class="card"><div class="metric">${a}</div><strong style="display:block;font-size:18px;margin-top:11px">${b}</strong></div>`).join('')}</div><div class="fineprint">All product data shown in this demonstration is fictional and safe.</div></div>`},

  ];
  const stage=document.getElementById('stage'); const music=document.getElementById('music');
  let idx=-1, current; function show(i){if(current){current.classList.remove('active');current.classList.add('exit');setTimeout(()=>current.remove(),800)}const el=document.createElement('section');el.className='scene';el.innerHTML=screens[i].html;stage.append(el);requestAnimationFrame(()=>el.classList.add('active'));current=el;idx=i;}
  let elapsed=0; show(0); function next(){elapsed+=screens[idx].d;if(idx<screens.length-1){show(idx+1);setTimeout(next,screens[idx].d*1000)}} setTimeout(next,screens[0].d*1000);
  document.addEventListener('click',()=>music.play().catch(()=>{}),{once:true}); window.addEventListener('load',()=>music.play().catch(()=>{}));
  </script>
