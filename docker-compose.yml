version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      PORT: 5002
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5002/api/v1/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL before building the production web image}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:?Set VITE_SOCKET_URL before building the production web image}
    ports:
      - "8080:80"
    depends_on:
      - api
